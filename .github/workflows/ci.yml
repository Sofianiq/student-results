# فحص تلقائي: الأنواع، الاختبارات، والبناء
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
